# Render Blueprint: New > Blueprint > pick this repo. Add NVIDIA_API_KEY when prompted.
services:
  - type: web
    name: ai-link-analysis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: LLM_FALLBACK_PROVIDER
        value: nvidia
      - key: LLM_FALLBACK_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: LLM_TIMEOUT_SECONDS
        value: "150"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: NVIDIA_API_KEY
        sync: false   # secret: entered in the Render dashboard, never stored in git
